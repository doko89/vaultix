name: Release

# Tag-driven release: push `v*` -> binaries + checksums + GitHub Release +
# manager image. Public home: github.com/doko89/vaultix.
on:
  push:
    tags: ['v*']

# One release per tag, never cancelled mid-flight (a cancelled release job
# could leave a tag with half its assets).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; each job declares what it needs.
permissions: {}

env:
  # Pinned toolchain (CI floats on stable/lts; releases must be reproducible).
  GO_VERSION: '1.27'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: build manager + agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          # Both binaries share `var version` in package main (cmd/manager +
          # cmd/agent); there is no separate commit symbol, so the short SHA
          # rides along in the version string: v1.2.3+abc1234.
          VERSION="${GITHUB_REF_NAME}+${GITHUB_SHA:0:7}"
          echo "version: ${VERSION}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/vaultix-manager-${GOOS}-${GOARCH}" ./cmd/manager
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/vaultix-agent-${GOOS}-${GOARCH}" ./cmd/agent
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vaultix-*
          if-no-files-found: error

  checksums:
    name: Checksums
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: write sha256sums.txt
        run: |
          cd dist
          sha256sum vaultix-* > sha256sums.txt
          cat sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [checksums]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: create release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Tag subject (annotated tags) with commit-subject fallback.
          SUBJECT="$(git tag -l --format='%(contents:subject)' "${TAG}" | head -n 1)"
          if [ -z "${SUBJECT}" ]; then
            SUBJECT="$(git log -1 --format=%s "${TAG}")"
          fi
          NOTES="$(mktemp)"
          {
            echo "${SUBJECT}"
            echo
            echo "## Artifacts"
            echo
            echo '```'
            cat dist/sha256sums.txt
            echo '```'
            echo
            echo "Installers: \`server.sh\` (manager via compose) and \`worker.sh\`"
            echo "(agent binary + systemd). See README Quick setup."
          } > "${NOTES}"
          # Re-running a tag release replaces assets instead of failing.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* install/server.sh install/worker.sh \
              --clobber
            gh release edit "${TAG}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" dist/* install/server.sh install/worker.sh \
              --title "${TAG}" --notes-file "${NOTES}"
          fi

  docker:
    name: Manager image
    runs-on: ubuntu-latest
    # After the GitHub Release so an image tag always has a matching release.
    needs: [release]
    permissions:
      contents: read
      # First push to ghcr.io/doko89/vaultix-manager CREATES the package
      # (inherited visibility; flip to public under Package settings after).
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: build + push manager image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/doko89/vaultix-manager"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -f deploy/manager.Dockerfile \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
