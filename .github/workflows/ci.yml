name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet, build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: golangci-lint
        if: hashFiles('.golangci.yml') != ''
        uses: golangci/golangci-lint-action@v8
      - name: sqlc drift check (non-blocking)
        # Regenerates with the pinned toolchain and fails the step (not the
        # job) when db/gen drifts from db/queries + sqlc config. Network
        # hiccups downloading the pinned module also land here, never red.
        if: hashFiles('sqlc.yaml', 'sqlc.yml', 'sqlc.json', 'db/sqlc.yaml', 'db/sqlc.yml') != ''
        continue-on-error: true
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0 generate
          git diff --exit-code -- db/gen || {
            echo "::warning::db/gen drifted from db/queries — run 'make sqlc-generate' and commit the result"
            exit 1
          }

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build

  compose:
    name: Compose (dev+e2e config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No images are pulled: `config -q` only parses + interpolates.
      # Each profile must validate alone (profile-scoped depends_on is a
      # classic footgun) and combined.
      - name: validate dev profile
        run: docker compose -f deploy/docker-compose.yml --profile dev config -q
      - name: validate e2e profile
        run: docker compose -f deploy/docker-compose.yml --profile e2e config -q
      - name: validate combined profiles
        run: docker compose -f deploy/docker-compose.yml --profile dev --profile e2e config -q
