# Vaultix local stacks: dev (MinIO backend) and e2e (S3Mock backend).
#
#   make compose-up     # dev:  postgres + minio + minio-init + manager (:8080)
#   make e2e-up         # e2e:  postgres + s3mock + s3-init + manager (:8081),
#                       #       isolated under project name vaultix-e2e
#
# Raw compose equivalents:
#   docker compose -f deploy/docker-compose.yml --profile dev up -d
#   docker compose -f deploy/docker-compose.yml -p vaultix-e2e --profile e2e \
#     -e VAULTIX_S3_ENDPOINT=http://s3mock:9090 ... up -d   # see make e2e-up
#
# Bare `up` (no profile) starts postgres + manager only; pick a profile for
# a working S3 backend. The manager intentionally depends only on postgres:
# the S3 registry resolves lazily per destination, so boot never blocks on
# object storage; bucket creation is ordered per backend via
# minio-init (dev) / s3-init (e2e).
#
# S3 BACKENDS — READ THIS:
# - dev/MinIO is the prod-like path (console + S3 API). Pinned release tags
#   are kept as defaults, overridable via MINIO_IMAGE / MC_IMAGE.
# - 2026-11-19: minio/minio and minio/mc are UNPULLABLE (Docker Hub answers
#   "pull access denied ... repository does not exist" for :latest AND the
#   pinned RELEASE tags; quay.io answers 401). Until that is resolved, dev
#   boot fails at image pull in a fresh environment — the e2e profile below
#   is the working path: adobe/s3mock:5.2.3 is VERIFIED to pull (digest
#   sha256:ab01a6946750..., identical to :latest on 2026-11-19).
#
# PROD HARDENING (do NOT use these dev defaults in production):
# - Secrets: inject via environment from a secret manager (or *_FILE vars), never
#   commit credentials. Rotate MINIO_ROOT_PASSWORD, POSTGRES_PASSWORD, and
#   VAULTIX_CRYPTO_KEY (the dev crypto default below is public by design).
# - Ports: do not publish postgres/minio ports to the host; keep them on the
#   internal network and reach them through the manager or a bastion.
# - TLS: terminate TLS in front of the manager (reverse proxy) and enable TLS on
#   postgres (sslmode=require+) and MinIO (certs dir); enable mTLS for agents
#   per PRD section 6.3.
# - Backups: pgdata holds ALL metadata — back it up (pg_basebackup/WAL archiving
#   to off-host storage) separately from the backup payload buckets.
# - Resources: set `deploy.resources.limits` and log rotation on every service.
# - Images: pin digest-pinned images from an internal mirror; run as non-root
#   (manager image already drops privileges; see deploy/manager.Dockerfile).
#
# Volumes are compose-prefixed per project (no fixed `name:`), so the e2e
# project never shares data with dev. NOTE: versions before the e2e work
# used fixed names (vaultix-pgdata, vaultix-minio-data); that data still
# sits in the old volumes — `docker volume ls | grep vaultix` to inspect.

services:
  # PostgreSQL metadata database (TECH_SPEC section 3: single DB, sqlc + pgx).
  # Shared by both profiles; project name (-p) isolates dev from e2e.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultix-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-vaultix}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # dev convenience; REMOVE in prod
    volumes:
      # Survives `compose down`. Destroy with `compose down -v`.
      # Prod: mount off-host / managed storage and enable PITR backups.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultix}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local dev (MinIO). Agents talk S3 API here
  # in dev; in prod this is real S3 or another S3-compatible endpoint and the
  # manager only stores endpoint/bucket config + issues presigned URLs.
  minio:
    profiles: ["dev"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vaultix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vaultix-dev-only-change-me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000" # S3 API; REMOVE in prod
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # console; REMOVE in prod
    volumes:
      # Dev payload data. Prod: real object storage, not a volume.
      - minio-data:/data
    healthcheck:
      # Documented MinIO liveness probe (the old `mc ready` probe could never
      # pass: the server image ships no mc binary).
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot dev setup: creates the default bucket. Exits 0 when done.
  minio-init:
    profiles: ["dev"]
    image: ${MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-38Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-vaultix} $${MINIO_ROOT_PASSWORD:-vaultix-dev-only-change-me} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-vaultix-backups} &&
      echo 'bucket ready: $${S3_BUCKET:-vaultix-backups}'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vaultix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vaultix-dev-only-change-me}
      S3_BUCKET: ${S3_BUCKET:-vaultix-backups}
    restart: "no"

  # Hermetic S3 for E2E (no MinIO pull needed; see header). S3Mock serves
  # plain HTTP on 9090. Ephemeral storage by design: e2e runs start clean.
  # No healthcheck: the image ships no curl/wget for probing — s3-init
  # retries instead (see below).
  s3mock:
    profiles: ["e2e"]
    image: ${S3MOCK_IMAGE:-adobe/s3mock:5.2.3}
    restart: unless-stopped
    ports:
      - "${S3MOCK_API_PORT:-9090}:9090" # S3 API; REMOVE in prod
    # Defaults serve plain HTTP on 9090; storage is ephemeral (see above).

  # One-shot e2e setup: waits for S3Mock, creates the default bucket.
  # Fails loudly (nonzero exit) when the bucket is still missing, so
  # `up` visibly reports a broken S3 path instead of booting half-ready.
  s3-init:
    profiles: ["e2e"]
    image: ${AWSCLI_IMAGE:-amazon/aws-cli:latest}
    depends_on:
      s3mock:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url \"$$S3_ENDPOINT\" s3 mb \"s3://$$S3_BUCKET\" 2>/dev/null && break;
        sleep 2;
      done;
      aws --endpoint-url \"$$S3_ENDPOINT\" s3 ls \"s3://$$S3_BUCKET\"
      "
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-vaultix}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-vaultix-dev-only-change-me}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://s3mock:9090
      S3_BUCKET: ${S3_BUCKET:-vaultix-backups}
    restart: "no"

  # Vaultix manager (control plane: API + scheduler + embedded web UI).
  # Boots `migrate up` automatically, then serves (cmd/manager/serve.go).
  # S3 backend is env-selected: dev default http://minio:9000, e2e overrides
  # to http://s3mock:9090 (see make e2e-up). Crypto key default is exactly
  # 32 chars (raw-key form accepted by the crypto box) — DEV ONLY.
  manager:
    build:
      context: ..
      dockerfile: deploy/manager.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VAULTIX_ADDR: ":8080"
      VAULTIX_LOG_LEVEL: ${VAULTIX_LOG_LEVEL:-info}
      VAULTIX_DATABASE_URL: postgres://${POSTGRES_USER:-vaultix}:${POSTGRES_PASSWORD:-vaultix-dev-only}@postgres:5432/${POSTGRES_DB:-vaultix}?sslmode=disable
      VAULTIX_CRYPTO_KEY: ${VAULTIX_CRYPTO_KEY:-dev-only-vaultix-crypto-key-0000}
      VAULTIX_S3_ENDPOINT: ${VAULTIX_S3_ENDPOINT:-http://minio:9000}
      VAULTIX_S3_BUCKET: ${S3_BUCKET:-vaultix-backups}
      VAULTIX_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-vaultix}
      VAULTIX_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vaultix-dev-only-change-me}
      VAULTIX_S3_REGION: ${MINIO_REGION:-us-east-1}
      VAULTIX_S3_USE_SSL: ${S3_USE_SSL:-false} # dev only; prod must be true
      VAULTIX_OIDC_REDIRECT_URL: ${VAULTIX_OIDC_REDIRECT_URL:-} # absolute IdP callback URL; empty disables OIDC login starts
    ports:
      - "${MANAGER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    # No volumes: manager is stateless; state lives in postgres (metadata) and
    # S3 (payloads). Prod: mount TLS certs / config read-only if file-based.

volumes:
  pgdata:
  minio-data:
